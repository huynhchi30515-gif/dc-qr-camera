
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DC - QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f3f5f8;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 12px #0001;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
      overflow: hidden;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .control-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .control-row button {
      flex: 1;
      margin-top: 0;
      padding: 12px 5px;
      font-size: 14px;
    }

    #flashBtn {
      background: #555;
    }

    #flashBtn.active {
      background: #e69b00;
    }

    #stopBtn {
      background: #c0392b;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      background: #eef5ff;
      border-radius: 8px;
      overflow-wrap: anywhere;
      min-height: 45px;
      line-height: 1.5;
    }

    .note {
      color: #666;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    .success {
      background: #e8f7ed !important;
      color: #176b35;
    }

    .error {
      background: #fff0f0 !important;
      color: #b42318;
    }

    .camera-info {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>QUÉT MÃ QR - DC</h2>

    <p class="note">
      Camera sau tự động lấy nét và Zoom 3x nếu thiết bị hỗ trợ.
      Hãy hướng mã QR vào giữa khung hình.
    </p>

    <div id="reader"></div>

    <button id="startBtn" onclick="startScanner()">
      MỞ CAMERA
    </button>

    <div id="cameraControls" class="hidden">

      <div class="control-row">

        <button id="flashBtn" onclick="toggleFlash()">
          BẬT FLASH
        </button>

        <button id="stopBtn" onclick="stopScanner()">
          TẮT CAMERA
        </button>

      </div>

      <div class="camera-info" id="cameraInfo">
        Đang kiểm tra camera...
      </div>

    </div>

    <button
      id="sendBtn"
      onclick="sendResult()"
      class="hidden"
    >
      GỬI MÃ QR VỀ TRANG NHẬP
    </button>

    <div id="result">
      Chưa quét mã QR.
    </div>

  </div>

  <script>

    let scanner = null;
    let scannedCode = "";

    let isScanning = false;
    let isSending = false;

    let flashOn = false;
    let flashSupported = false;

    const DEFAULT_ZOOM = 3;

    // =====================================
    // KHỞI ĐỘNG CAMERA
    // =====================================

    async function startScanner() {

      const result = document.getElementById("result");
      const startBtn = document.getElementById("startBtn");

      if (isScanning) return;

      scannedCode = "";
      isSending = false;
      flashOn = false;

      document.getElementById("sendBtn").classList.add("hidden");

      document.getElementById("cameraControls").classList.add("hidden");

      document.getElementById("flashBtn").textContent = "BẬT FLASH";

      document.getElementById("flashBtn").classList.remove("active");

      startBtn.disabled = true;

      result.className = "";
      result.textContent = "Đang khởi động camera...";

      try {

        scanner = new Html5Qrcode("reader", {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          verbose: false
        });

        await scanner.start(

          { facingMode: "environment" },

          {
            fps: 15,

            qrbox: function(viewfinderWidth, viewfinderHeight) {

              const size = Math.floor(
                Math.min(viewfinderWidth, viewfinderHeight) * 0.78
              );

              return {
                width: size,
                height: size
              };

            },

            aspectRatio: 1.0
          },

          function(decodedText) {
            handleScanSuccess(decodedText);
          },

          function(errorMessage) {
            // Không hiển thị lỗi khi chưa tìm thấy QR.
          }

        );

        isScanning = true;

        startBtn.classList.add("hidden");

        document.getElementById("cameraControls").classList.remove("hidden");

        result.textContent =
          "Camera đang hoạt động. Hãy hướng camera vào mã QR.";

        // Tối ưu camera sau khi mở.

        await optimizeCamera();

      } catch (error) {

        isScanning = false;

        startBtn.disabled = false;

        startBtn.classList.remove("hidden");

        result.className = "error";

        result.textContent =
          "Không mở được camera: " +
          (error.message || error);

        scanner = null;

      }

    }


    // =====================================
    // TỰ ĐỘNG LẤY NÉT VÀ ZOOM 3X
    // =====================================

    async function optimizeCamera() {

      const info = document.getElementById("cameraInfo");

      try {

        if (!scanner || !isScanning) return;

        const capabilities =
          scanner.getRunningTrackCapabilities();

        let messages = [];

        // -----------------------------
        // TỰ ĐỘNG LẤY NÉT
        // -----------------------------

        if (
          capabilities &&
          capabilities.focusMode &&
          capabilities.focusMode.includes("continuous")
        ) {

          try {

            await scanner.applyVideoConstraints({
              advanced: [
                { focusMode: "continuous" }
              ]
            });

            messages.push("Đã bật lấy nét liên tục");

          } catch (e) {

            messages.push("Lấy nét theo mặc định của camera");

          }

        } else {

          messages.push("Lấy nét theo mặc định của camera");

        }

        // -----------------------------
        // TỰ ĐỘNG ZOOM 3X
        // -----------------------------

        const zoom = capabilities
          ? capabilities.zoom
          : null;

        if (
          zoom &&
          typeof zoom.min === "number" &&
          typeof zoom.max === "number" &&
          zoom.min <= DEFAULT_ZOOM &&
          zoom.max >= DEFAULT_ZOOM
        ) {

          try {

            await scanner.applyVideoConstraints({
              advanced: [
                { zoom: DEFAULT_ZOOM }
              ]
            });

            messages.push("Zoom 3x");

          } catch (e) {

            messages.push("Thiết bị không áp dụng được Zoom 3x");

          }

        } else {

          messages.push("Camera không hỗ trợ Zoom 3x");

        }

        // -----------------------------
        // KIỂM TRA FLASH
        // -----------------------------

        flashSupported = !!(
          capabilities &&
          capabilities.torch
        );

        const flashBtn = document.getElementById("flashBtn");

        flashBtn.disabled = !flashSupported;

        if (!flashSupported) {

          flashBtn.textContent = "KHÔNG HỖ TRỢ FLASH";

        }

        info.textContent = messages.join(" | ");

      } catch (error) {

        info.textContent =
          "Camera đang sử dụng chế độ mặc định.";

      }

    }


    // =====================================
    // BẬT / TẮT FLASH
    // =====================================

    async function toggleFlash() {

      if (!scanner || !isScanning || !flashSupported) return;

      const btn = document.getElementById("flashBtn");

      try {

        const newState = !flashOn;

        await scanner.applyVideoConstraints({
          advanced: [
            { torch: newState }
          ]
        });

        flashOn = newState;

        if (flashOn) {

          btn.textContent = "TẮT FLASH";

          btn.classList.add("active");

        } else {

          btn.textContent = "BẬT FLASH";

          btn.classList.remove("active");

        }

      } catch (error) {

        document.getElementById("result").textContent =
          "Thiết bị không hỗ trợ bật/tắt Flash.";

      }

    }


    // =====================================
    // QUÉT QR THÀNH CÔNG
    // =====================================

    async function handleScanSuccess(decodedText) {

      if (!decodedText || scannedCode || !isScanning) return;

      scannedCode = String(decodedText).trim();

      isScanning = false;

      const result = document.getElementById("result");

      result.className = "success";

      result.textContent =
        "Đã quét được mã QR: " + scannedCode;

      // Tắt camera sau khi quét.

      try {

        if (scanner) {
          await scanner.stop();
        }

      } catch (error) {}

      document.getElementById("cameraControls").classList.add("hidden");

      document.getElementById("startBtn").classList.add("hidden");

      document.getElementById("sendBtn").classList.remove("hidden");

    }


    // =====================================
    // TẮT CAMERA
    // =====================================

    async function stopScanner() {

      try {

        if (scanner && isScanning) {

          await scanner.stop();

        }

      } catch (error) {}

      isScanning = false;
      flashOn = false;

      scanner = null;

      document.getElementById("cameraControls").classList.add("hidden");

      document.getElementById("startBtn").classList.remove("hidden");

      document.getElementById("startBtn").disabled = false;

      document.getElementById("result").textContent =
        "Camera đã tắt. Nhấn MỞ CAMERA để quét lại.";

    }


    // =====================================
    // GỬI MÃ QR VỀ GOOGLE SHEETS
    // =====================================

    function sendResult() {

      if (!scannedCode) {

        alert("Chưa có mã QR.");

        return;

      }

      if (isSending) return;

      if (window.opener && !window.opener.closed) {

        isSending = true;

        window.opener.postMessage(

          {
            type: "QR_SCANNED",
            code: scannedCode
          },

          "*"

        );

        document.getElementById("result").textContent =
          "Đã gửi mã QR về trang nhập liệu.";

        setTimeout(function() {

          window.close();

        }, 500);

      } else {

        document.getElementById("result").className = "error";

        document.getElementById("result").textContent =
          "Không tìm thấy trang nhập liệu đang mở. " +
          "Vui lòng mở camera từ nút Quét QR trong trang Apps Script.";

      }

    }

  </script>

</body>
</html>
