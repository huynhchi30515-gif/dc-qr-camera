
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DC - QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f3f5f8;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 12px #0001;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
      overflow: hidden;
      border-radius: 10px;
    }

    #reader video {
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .control-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .control-row button {
      flex: 1;
      margin-top: 0;
      padding: 12px 5px;
      font-size: 14px;
    }

    #flashBtn {
      background: #555;
    }

    #flashBtn.active {
      background: #e69b00;
    }

    #stopBtn {
      background: #c0392b;
    }

    #zoomSection {
      display: none;
      margin-top: 18px;
      padding: 12px;
      background: #f4f6f8;
      border-radius: 8px;
    }

    #zoomSlider {
      width: 100%;
      margin-top: 10px;
    }

    #zoomValue {
      font-weight: bold;
      color: #1769aa;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      background: #eef5ff;
      border-radius: 8px;
      overflow-wrap: anywhere;
      min-height: 45px;
      line-height: 1.5;
    }

    .note {
      color: #666;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    .success {
      background: #e8f7ed !important;
      color: #176b35;
    }

    .error {
      background: #fff0f0 !important;
      color: #b42318;
    }

    .camera-info {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h2>QUÉT MÃ QR - DC</h2>

    <p class="note">
      Đưa mã QR vào giữa khung hình.
      Camera sẽ tự động lấy nét nếu thiết bị hỗ trợ.
    </p>

    <div id="reader"></div>

    <button id="startBtn" onclick="startScanner()">
      MỞ CAMERA
    </button>

    <div id="cameraControls" class="hidden">

      <div class="control-row">
        <button id="flashBtn" onclick="toggleFlash()">
          BẬT FLASH
        </button>

        <button id="stopBtn" onclick="stopScanner()">
          TẮT CAMERA
        </button>
      </div>

      <div id="zoomSection">
        <label>
          <strong>ZOOM CAMERA:</strong>
          <span id="zoomValue">1.0x</span>
        </label>

        <input
          type="range"
          id="zoomSlider"
          min="1"
          max="1"
          step="0.1"
          value="1"
          oninput="changeZoom(this.value)"
        >

        <p class="note">
          Kéo thanh trượt để phóng to hoặc thu nhỏ mã QR.
        </p>
      </div>

      <div class="camera-info" id="cameraInfo">
        Đang kiểm tra khả năng lấy nét của camera...
      </div>

    </div>

    <button
      id="sendBtn"
      onclick="sendResult()"
      class="hidden"
    >
      GỬI MÃ QR VỀ TRANG NHẬP
    </button>

    <div id="result">
      Chưa quét mã QR.
    </div>

  </div>

  <script>
    let scanner = null;
    let scannedCode = "";
    let isScanning = false;
    let isSending = false;

    let flashOn = false;
    let flashSupported = false;
    let zoomSupported = false;

    let zoomMin = 1;
    let zoomMax = 1;
    let zoomStep = 0.1;

    // =====================================
    // KHỞI ĐỘNG CAMERA
    // =====================================

    async function startScanner() {

      const result = document.getElementById("result");
      const startBtn = document.getElementById("startBtn");

      if (isScanning) return;

      scannedCode = "";
      isSending = false;
      flashOn = false;

      document.getElementById("sendBtn").classList.add("hidden");
      document.getElementById("cameraControls").classList.add("hidden");

      document.getElementById("flashBtn").textContent = "BẬT FLASH";
      document.getElementById("flashBtn").classList.remove("active");

      startBtn.disabled = true;
      result.className = "";
      result.textContent = "Đang khởi động camera...";

      try {

        scanner = new Html5Qrcode("reader", {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          verbose: false
        });

        await scanner.start(
          { facingMode: "environment" },

          {
            fps: 15,

            qrbox: function(viewfinderWidth, viewfinderHeight) {

              const size = Math.floor(
                Math.min(viewfinderWidth, viewfinderHeight) * 0.78
              );

              return {
                width: size,
                height: size
              };
            },

            aspectRatio: 1.0
          },

          function(decodedText) {
            handleScanSuccess(decodedText);
          },

          function(errorMessage) {
            // Không hiển thị lỗi liên tục khi chưa tìm thấy QR.
          }
        );

        isScanning = true;

        startBtn.classList.add("hidden");

        document.getElementById("cameraControls").classList.remove("hidden");

        result.textContent =
          "Camera đang hoạt động. Hãy hướng camera vào mã QR.";

        // Kiểm tra và tối ưu camera sau khi mở.

        await optimizeCamera();

      } catch (error) {

        isScanning = false;

        startBtn.disabled = false;
        startBtn.classList.remove("hidden");

        result.className = "error";

        result.textContent =
          "Không mở được camera: " +
          (error.message || error);

        scanner = null;
      }
    }


    // =====================================
    // TỰ ĐỘNG LẤY NÉT VÀ KIỂM TRA ZOOM
    // =====================================

    async function optimizeCamera() {

      const info = document.getElementById("cameraInfo");

      try {

        if (!scanner || !isScanning) return;

        const capabilities = scanner.getRunningTrackCapabilities();

        const settings = scanner.getRunningTrackSettings();

        let focusMessage = "Camera đang sử dụng chế độ lấy nét mặc định.";

        // Yêu cầu lấy nét liên tục nếu camera hỗ trợ.

        if (
          capabilities &&
          capabilities.focusMode &&
          capabilities.focusMode.includes("continuous")
        ) {

          try {

            await scanner.applyVideoConstraints({
              advanced: [
                { focusMode: "continuous" }
              ]
            });

            focusMessage = "Đã bật lấy nét liên tục.";

          } catch (e) {

            focusMessage =
              "Camera không cho phép điều khiển lấy nét liên tục.";

          }
        }

        // Kiểm tra Zoom.

        if (
          capabilities &&
          capabilities.zoom !== undefined
        ) {

          zoomMin = capabilities.zoom.min || 1;
          zoomMax = capabilities.zoom.max || 1;
          zoomStep = capabilities.zoom.step || 0.1;

          if (zoomMax > zoomMin) {

            zoomSupported = true;

            // Mặc định Zoom 3x, giới hạn theo khả năng camera.
const defaultZoom = Math.min(3, zoomMax);

const currentZoom = Math.max(
  zoomMin,
  defaultZoom
);

// Áp dụng Zoom mặc định 3x.
try {
  await scanner.applyVideoConstraints({
    advanced: [
      { zoom: currentZoom }
    ]
  });
} catch (e) {}

            const slider = document.getElementById("zoomSlider");

            slider.min = zoomMin;
            slider.max = zoomMax;
            slider.step = zoomStep;
            slider.value = currentZoom;

            document.getElementById("zoomValue").textContent =
              Number(currentZoom).toFixed(1) + "x";

            document.getElementById("zoomSection").style.display =
              "block";

          } else {

            zoomSupported = false;

          }

        } else {

          zoomSupported = false;

        }

        // Kiểm tra Flash.

        flashSupported = !!(
          capabilities &&
          capabilities.torch
        );

        document.getElementById("flashBtn").disabled =
          !flashSupported;

        if (!flashSupported) {

          document.getElementById("flashBtn").textContent =
            "KHÔNG HỖ TRỢ FLASH";

        }

        info.textContent = focusMessage;

      } catch (error) {

        info.textContent =
          "Camera đang sử dụng chế độ lấy nét mặc định.";

      }
    }


    // =====================================
    // ĐIỀU CHỈNH ZOOM
    // =====================================

    async function changeZoom(value) {

      document.getElementById("zoomValue").textContent =
        Number(value).toFixed(1) + "x";

      if (!scanner || !isScanning || !zoomSupported) return;

      try {

        await scanner.applyVideoConstraints({
          advanced: [
            { zoom: Number(value) }
          ]
        });

      } catch (error) {

        document.getElementById("cameraInfo").textContent =
          "Không thể điều chỉnh Zoom trên thiết bị này.";

      }
    }


    // =====================================
    // BẬT / TẮT FLASH
    // =====================================

    async function toggleFlash() {

      if (!scanner || !isScanning || !flashSupported) return;

      const btn = document.getElementById("flashBtn");

      try {

        const newState = !flashOn;

        await scanner.applyVideoConstraints({
          advanced: [
            { torch: newState }
          ]
        });

        flashOn = newState;

        if (flashOn) {

          btn.textContent = "TẮT FLASH";
          btn.classList.add("active");

        } else {

          btn.textContent = "BẬT FLASH";
          btn.classList.remove("active");

        }

      } catch (error) {

        document.getElementById("result").textContent =
          "Thiết bị không hỗ trợ bật/tắt Flash.";

      }
    }


    // =====================================
    // XỬ LÝ KHI QUÉT THÀNH CÔNG
    // =====================================

    async function handleScanSuccess(decodedText) {

      if (!decodedText || scannedCode || !isScanning) return;

      scannedCode = String(decodedText).trim();

      isScanning = false;

      const result = document.getElementById("result");

      result.className = "success";

      result.textContent =
        "Đã quét được mã QR: " + scannedCode;

      // Dừng camera sau khi quét thành công.

      try {

        if (scanner) {
          await scanner.stop();
        }

      } catch (error) {}

      document.getElementById("cameraControls").classList.add("hidden");

      document.getElementById("startBtn").classList.add("hidden");

      document.getElementById("sendBtn").classList.remove("hidden");
    }


    // =====================================
    // TẮT CAMERA
    // =====================================

    async function stopScanner() {

      try {

        if (scanner && isScanning) {
          await scanner.stop();
        }

      } catch (error) {}

      isScanning = false;
      flashOn = false;

      document.getElementById("cameraControls").classList.add("hidden");

      document.getElementById("startBtn").classList.remove("hidden");

      document.getElementById("startBtn").disabled = false;

      document.getElementById("result").textContent =
        "Camera đã tắt. Nhấn MỞ CAMERA để quét lại.";

      scanner = null;
    }


    // =====================================
    // GỬI MÃ QR VỀ GOOGLE SHEETS
    // =====================================

    function sendResult() {

      if (!scannedCode) {

        alert("Chưa có mã QR.");

        return;
      }

      if (isSending) return;

      if (window.opener && !window.opener.closed) {

        isSending = true;

        window.opener.postMessage(
          {
            type: "QR_SCANNED",
            code: scannedCode
          },
          "*"
        );

        document.getElementById("result").textContent =
          "Đã gửi mã QR về trang nhập liệu.";

        setTimeout(function() {
          window.close();
        }, 500);

      } else {

        document.getElementById("result").className = "error";

        document.getElementById("result").textContent =
          "Không tìm thấy trang nhập liệu đang mở. " +
          "Vui lòng mở camera từ nút Quét QR trong trang Apps Script.";

      }
    }

  </script>

</body>
</html>
